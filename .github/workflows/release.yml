name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public source boundaries
        run: python scripts/check-public.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            mobile/go.sum
            installer/go.sum
      - name: Build release from the tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?)$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH or a prerelease suffix'
          }
          ./scripts/build.ps1 -Version $Matches.version
      - name: Upload the package and SHA256 checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $zip = Join-Path $PWD ('dist/mihomo-mobile-panel-' + $version + '.zip')
          $checksum = $zip + '.sha256'
          gh release create $env:GITHUB_REF_NAME $zip $checksum --verify-tag --generate-notes --title ('Mihomo Mobile Panel ' + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
