name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public source boundaries
        run: python3 scripts/check-public.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: mobile/go.sum
      - name: Test panel
        working-directory: mobile
        run: go test -trimpath -buildvcs=false ./...
      - name: Check panel
        working-directory: mobile
        run: go vet ./...
      - name: Cross-build router service
        working-directory: mobile
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags='-s -w' -o "${RUNNER_TEMP}/mihomo-mobile" .

  windows-release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public source boundaries
        run: python scripts/check-public.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            mobile/go.sum
            installer/go.sum
      - name: Test and build the public package
        shell: pwsh
        run: ./scripts/build.ps1 -Version 4.0.1
